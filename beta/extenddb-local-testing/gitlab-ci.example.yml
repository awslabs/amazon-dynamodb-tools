# ExtendDB as a DynamoDB-compatible service for GitLab CI.
#
# Copy this to .gitlab-ci.yml in your own repository, or include it from one.
# GitLab CI does not wait for a service's HEALTHCHECK, so each job waits for the
# endpoint itself before running tests.
#
# The service runs as a separate container on a shared network, so it is reached
# by its alias (dynamodb), not localhost.
#
# The `cd harness/<lang>` lines are relative to your repository root. Point them
# at wherever your own tests live.
#
# Pitfalls when adapting this file:
# - A job-level `before_script:` replaces the inherited one, silently dropping the
#   wait loop. Keep it by referencing it, for example:
#     before_script:
#       - !reference [.extenddb, before_script]
#       - your own commands
# - A job-level `services:` likewise replaces the inherited service list.
#
# The image has its own HEALTHCHECK. Leave any shell-form health command off the
# service, because the image is distroless and has no shell to run one.

variables:
  DDB_ENDPOINT: "http://dynamodb:18080"
  AWS_REGION: "us-east-1"
  # These are AWS's published example credentials. ExtendDB seeds this pair and
  # verifies each request's SigV4 signature against it, so the job signs with
  # the same pair.
  AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
  AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  EXTENDDB__STORAGE__SQLITE__PATH: ":memory:"

.extenddb:
  services:
    - name: extenddb/extenddb-dev:0.1.14
      alias: dynamodb
  before_script:
    # Wait up to about 3 minutes (60 tries, each a 2 s curl timeout plus a 1 s
    # sleep), then fail the job with a clear message.
    # Any HTTP status other than 000 means the port answered.
    - |
      if ! command -v curl >/dev/null 2>&1; then
        echo "curl is not installed in the job image, so ExtendDB's readiness cannot be checked." >&2
        exit 1
      fi
      echo "Waiting for ExtendDB at $DDB_ENDPOINT"
      for i in $(seq 1 60); do
        code=$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' "$DDB_ENDPOINT" || true)
        # Only a real three-digit status other than 000 counts as answering.
        if [ "$code" != "000" ] && printf '%s' "$code" | grep -Eq '^[0-9]{3}$'; then
          echo "ExtendDB answering (HTTP $code)"
          break
        fi
        if [ "$i" = "60" ]; then
          echo "ExtendDB never answered at $DDB_ENDPOINT after 60 attempts." >&2
          echo "Check that the service alias is 'dynamodb' and that the image can be pulled." >&2
          exit 1
        fi
        sleep 1
      done

typescript:
  extends: .extenddb
  image: node:22
  script:
    - cd harness/typescript
    - npm ci
    - npm test

python:
  extends: .extenddb
  image: python:3.11
  script:
    - cd harness/python
    - pip install -r requirements.txt
    - python -m pytest -v

java:
  extends: .extenddb
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd harness/java
    - mvn -B -ntp test
